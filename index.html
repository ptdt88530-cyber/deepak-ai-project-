<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#050a12;color:#00eaff;
  font-family:Arial,sans-serif;min-height:100vh;
  display:flex;align-items:center;justify-content:center;
}
.app{width:100%;max-width:500px;padding:22px;text-align:center}
h1{letter-spacing:8px;text-shadow:0 0 15px #00eaff}
.arc{
  width:150px;height:150px;border:5px solid #00eaff;
  border-radius:50%;margin:28px auto;
  box-shadow:0 0 20px #00eaff,inset 0 0 20px #00eaff;
  display:flex;align-items:center;justify-content:center;
  animation:glow 2s infinite alternate;
}
.arc span{font-size:35px;font-weight:bold}
@keyframes glow{to{box-shadow:0 0 35px #00eaff,inset 0 0 30px #00eaff}}
.status{color:#8aaebd;font-size:13px;margin:20px}
.chat{
  height:230px;overflow-y:auto;border:1px solid #07556a;
  padding:12px;text-align:left;border-radius:12px;
  background:#07111c;margin:20px 0;
}
.msg{padding:10px;margin:8px 0;border-radius:8px;overflow-wrap:anywhere}
.bot{background:#0b2634;color:#00eaff}
.user{background:#12303c;color:white;text-align:right}
input{
  width:100%;padding:15px;background:#07111c;
  border:1px solid #00bcd4;border-radius:10px;
  color:white;font-size:16px;outline:none
}
button{
  padding:13px 18px;margin:7px 3px;border:1px solid #00eaff;
  background:#082634;color:#00eaff;border-radius:9px;
  font-size:15px;cursor:pointer
}
button:active{background:#07556a}
.small{color:#7897a5;font-size:12px;margin-top:20px}
</style>
</head>
<body>
<div class="app">
  <h1>J.A.R.V.I.S</h1>
  <div class="arc"><span>AI</span></div>
  <div class="status" id="status">SYSTEM ONLINE • READY</div>
  <div class="chat" id="chat">
    <div class="msg bot">Hello! I am your Jarvis assistant. Type a message to begin.</div>
  </div>
  <input id="input" placeholder="Ask Jarvis anything..." />
  <button onclick="sendMessage()">SEND</button>
  <button onclick="listen()">🎙️ SPEAK</button>
  <button onclick="speakLast()">🔊 REPEAT</button>
  <div class="small">PERSONAL AI INTERFACE • VERSION 1.0</div>
</div>
<script>
let lastReply="Hello! I am Jarvis.";
function addMessage(text,type){
  const div=document.createElement("div");
  div.className="msg "+type;
  div.textContent=text;
  document.getElementById("chat").appendChild(div);
  document.getElementById("chat").scrollTop=999999;
}
function getReply(text){
  const t=text.toLowerCase();
  if(t.includes("hello")||t.includes("hi")||t.includes("namaste"))
    return "Namaste! Main Jarvis hoon. Aaj main aapki kya madad kar sakta hoon?";
  if(t.includes("naam")||t.includes("your name"))
    return "Mera naam Jarvis AI hai.";
  if(t.includes("time")||t.includes("samay"))
    return "Aapke device ka samay: "+new Date().toLocaleTimeString();
  if(t.includes("date")||t.includes("tarikh"))
    return "Aaj ki date: "+new Date().toLocaleDateString();
  if(t.includes("joke")||t.includes("chutkula"))
    return "Jarvis joke: Computer thak kyun gaya? Kyunki usne bahut saare windows khol rakhe the!";
  if(t.includes("help")||t.includes("madad"))
    return "Aap hello, time, date ya joke pooch sakte hain. Real AI ke liye baad mein AI API connect karenge.";
  return "Aapne kaha: "+text+". Main abhi basic Jarvis hoon. Intelligent AI answers ke liye mujhe secure AI service se connect karna hoga.";
}
function sendMessage(){
  const input=document.getElementById("input");
  const text=input.value.trim();
  if(!text)return;
  addMessage(text,"user");
  input.value="";
  document.getElementById("status").textContent="PROCESSING...";
  setTimeout(()=>{
    lastReply=getReply(text);
    addMessage(lastReply,"bot");
    document.getElementById("status").textContent="SYSTEM ONLINE • READY";
    if("speechSynthesis" in window){
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(lastReply);
      u.lang="hi-IN";
      speechSynthesis.speak(u);
    }
  },300);
}
function listen(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert("Voice input may not be supported in this browser. Try Chrome.");return;}
  const rec=new SR();
  rec.lang="hi-IN";
  rec.onstart=()=>document.getElementById("status").textContent="LISTENING...";
  rec.onresult=e=>{
    document.getElementById("input").value=e.results[0][0].transcript;
    sendMessage();
  };
  rec.onerror=()=>document.getElementById("status").textContent="VOICE INPUT UNAVAILABLE";
  rec.onend=()=>document.getElementById("status").textContent="SYSTEM ONLINE • READY";
  rec.start();
}
function speakLast(){
  if(!("speechSynthesis" in window)){alert("Speech is not supported in this browser.");return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(lastReply);
  u.lang="hi-IN";
  speechSynthesis.speak(u);
}
document.getElementById("input").addEventListener("keydown",e=>{
  if(e.key==="Enter")sendMessage();
});
</script>
</body>
</html>
